name: Diagnose Dualangka Deploy

on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/diagnose-dualangka.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - name: Inspect legacy dualangka deploy target
        shell: bash
        run: |
          set -euo pipefail
          echo "USER=$(id)"
          echo "=== deploy scripts ==="
          ls -l /usr/local/bin/deploy-zetruv-frontend* || true
          echo "=== legacy deploy script ==="
          sed -n "1,260p" /usr/local/bin/deploy-zetruv-frontend || true
          echo "=== sudo permissions ==="
          sudo -n -l || true
          echo "=== target ==="
          ls -ld /var/www/zetruv-frontend || true
          readlink -f /var/www/zetruv-frontend || true
          echo "=== target git/dist ==="
          ls -ld /var/www/zetruv-frontend/.git /var/www/zetruv-frontend/dist 2>/dev/null || true
          echo "=== nginx root site ==="
          cat /etc/nginx/sites-enabled/zetruv || true
          echo "=== nginx dev site ==="
          cat /etc/nginx/sites-enabled/zetruv-frontend-dev || true
          echo "=== dev release path ==="
          ls -ld /var/www/zetruv-dev /var/www/zetruv-dev/current 2>/dev/null || true
          readlink -f /var/www/zetruv-dev/current || true
          echo "=== nginx references ==="
          grep -R "zetruv.dualangka.com\|/var/www/zetruv-frontend" /etc/nginx/sites-enabled /etc/nginx/conf.d 2>/dev/null || true
