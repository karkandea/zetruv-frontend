name: Temporary Provider Mapping Admin Integration

on:
  push:
    branches:
      - feat/provider-mapping-admin

permissions:
  contents: write

jobs:
  integrate:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/provider-mapping-admin
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch admin route
        run: python3 scripts/patch-provider-mapping-admin.py
      - name: Build storefront and admin
        run: |
          npm install --no-package-lock --no-audit --no-fund
          npm run build:all:dev
      - name: Commit integration patch
        run: |
          if git diff --quiet -- src/admin/AdminApp.jsx; then
            echo "Admin route already integrated"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/admin/AdminApp.jsx
          git commit -m "feat: wire provider mapping admin route"
          git push origin HEAD:feat/provider-mapping-admin
