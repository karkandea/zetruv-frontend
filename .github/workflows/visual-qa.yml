name: DEV responsive visual QA (no deploy)
on:
  pull_request:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual-qa:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install and build DEV storefront
        run: |
          npm install --no-audit --no-fund
          npm run build:storefront:dev
      - name: Install isolated browser test runner
        run: |
          npm install --no-save --no-audit --no-fund playwright
          npx playwright install chromium
      - name: Serve PR build locally
        run: |
          npm run preview -- --host 127.0.0.1 --port 4178 > /tmp/zetruv-visual-preview.log 2>&1 &
          for n in $(seq 1 30); do curl -fsS http://127.0.0.1:4178/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/zetruv-visual-preview.log
          exit 1
      - name: Capture desktop and mobile before/after
        run: node scripts/visual-qa.mjs
      - name: Preserve screenshot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zetruv-responsive-before-after
          path: visual-qa/
          if-no-files-found: warn
          retention-days: 14
