name: Zetruv DEV completed pages E2E (VPS)
on:
  push:
    branches: [qa/e2e-completed-pages-20261015]
    paths:
      - 'scripts/completed-pages-e2e.mjs'
      - '.github/workflows/e2e-completed-pages.yml'
      - 'docs/e2e-completed-pages.md'
  pull_request:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  completed-pages-e2e:
    # Same VPS self-hosted runner used by the existing DEV QA/deployment.
    # Read-only browser probes target the already deployed DEV storefront.
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated browser driver
        run: |
          npm install --no-audit --no-fund
          npm install --no-save --no-audit --no-fund playwright
          npx playwright install chromium
      - name: Browser E2E against VPS DEV
        env:
          ZETRUV_E2E_BASE_URL: https://dev.zetruv.com
        run: node scripts/completed-pages-e2e.mjs
      - name: Publish run summary
        if: always()
        shell: bash
        run: |
          if [ -f e2e-results/summary.json ]; then
            node --input-type=module -e "import fs from 'node:fs';const s=JSON.parse(fs.readFileSync('e2e-results/summary.json'));console.log('Passed: '+s.passed+'; Failed: '+s.failed+'; Target: '+s.base)" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo 'This is render/safe-navigation smoke; customer-order and payment backend acceptance remain BLOCKED until wired.' >> "$GITHUB_STEP_SUMMARY"
      - name: Save E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zetruv-dev-completed-pages-e2e
          path: e2e-results/
          retention-days: 14
          if-no-files-found: warn
