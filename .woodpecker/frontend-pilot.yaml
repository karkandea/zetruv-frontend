when:
  - event: [push, manual]
    branch: ci/woodpecker-pilot

steps:
  - name: frontend-build-test
    image: node:22-bookworm-slim
    commands:
      - node --version
      - if test -f package-lock.json; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
      - npm run build:all:dev
